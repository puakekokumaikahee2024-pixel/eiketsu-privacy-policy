<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サポート – 英傑麻雀</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0d0d0d;
      color: #e0d4b0;
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    h1 { font-size: 1.6rem; color: #c8a060; letter-spacing: 0.15em; margin-bottom: 8px; }
    .subtitle { font-size: 0.85rem; color: #888; margin-bottom: 48px; letter-spacing: 0.1em; }
    .card {
      border: 1px solid #c8a06044;
      border-radius: 8px;
      padding: 32px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      background: #111;
    }
    .card p { font-size: 0.95rem; line-height: 1.9; color: #ccc; margin-bottom: 24px; }
    .card a { color: #c8a060; text-decoration: none; font-size: 1rem; border-bottom: 1px solid #c8a06066; padding-bottom: 2px; }
    .divider { width: 48px; height: 1px; background: #c8a06066; margin: 0 auto 24px; }
    footer { margin-top: 48px; font-size: 0.75rem; color: #555; letter-spacing: 0.08em; }
  </style>
</head>

  <h1>英傑麻雀</h1>

  <div class="card">
    <p>ご意見・ご要望・不具合のご報告は、以下のメールアドレスまでお送りください。</p>
